<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>
</head>
<body>

    <form id="formDuLich">
        <h2 align="center" style="color: #006699;">Đăng ký du lịch</h2>

        <table border="1" align="center" cellpadding="5" cellspacing="0" bgcolor="#FFFFCC" width="550">
            <tr>
                <td width="35%">Họ và tên</td>
                <td><input type="text" id="txtHoTen" size="35" value="Nguyễn Giang Tưởng"></td>
            </tr>
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" id="txtDiaChi" size="35" value="36F/1B, Bình Hòa, TpHCM "></td>
            </tr>
            <tr>
                <td>Điện thoại</td>
                <td><input type="text" id="txtDienThoai" size="20" value="0333333334"></td>
            </tr>
            <tr>
                <td>Khách Việt Nam</td>
                <td><input type="checkbox" id="chkVietNam" checked></td>
            </tr>
            <tr>
                <td>Chọn tour</td>
                <td>
                    <select id="slTour">
                        <optgroup label="Miền Bắc">
                            <option value="HN-HL-Sapa">Hà Nội - Hạ Long - Sapa</option>
                            <option value="HN-CH-NB">Hà Nội - Chùa Hương - Ninh Bình</option>
                            <option value="HN-CB-TC">Hà Nội - Cát Bà - Tuần Châu</option>
                        </optgroup>
                        <optgroup label="Miền Trung">
                            <option value="Hue-DM-DN">Huế - Bạch Mã - Đà Nẵng</option>
                            <option value="NT-DL">Nha Trang - Đà Lạt</option>
                            <option value="BMT-GL-KT" selected>Buôn mê thuột - Gia lai - Kontum</option>
                        </optgroup>
                        <optgroup label="Miền Nam">
                            <option value="HCM-CT-CM">TP HCM - Cần Thơ - Cà Mau</option>
                            <option value="HCM-MT">TP HCM - Mỹ Tho</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Phương tiện</td>
                <td>
                    <input type="radio" name="rdPhươngTien" value="Máy bay"> Máy bay
                    <input type="radio" name="rdPhươngTien" value="Xe ô tô" checked> Xe ô tô
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <fieldset style="width: 400px; text-align: left;">
                        <legend align="left" style="font-style: italic; color: brown; font-weight: bold;">Số lượng đoàn khách</legend>
                        Người lớn <input type="text" id="txtNguoiLon" size="3" value="5">
                        Trẻ em <input type="text" id="txtTreEm" size="3" value="4">
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td>Ghi chú thêm</td>
                <td>
                    <textarea id="txtGhiChu" rows="3" cols="35">Có 2 trẻ em dưới 6 tuổi&#10;Có 2 người ăn chay</textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" value="Đồng ý" onclick="xuLyDangKy()">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <div id="lblThongBao" style="color: red; font-weight: bold;"></div>
                </td>
            </tr>
        </table>
    </form>

    <script>
        function xuLyDangKy() {
            document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>

</body>
</html>
